  url: http://localhost:8090/documents/batch
  body:
    type: json
    data: |-
      {
        "document_ids": [
          "document-id"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
