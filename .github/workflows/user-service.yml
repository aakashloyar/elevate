name: User Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "user/**"
      - ".github/workflows/user-service.yml"

env:
  SERVICE_NAME: user
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/user

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: user

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: user/go.mod
          cache-dependency-path: user/go.sum

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('user/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Dependencies
        run: go mod download

      - name: Verify Formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test ./...

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build \
            -f Dockerfile \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.USER_EC2_HOST }}
          username: ${{ secrets.USER_EC2_USER }}
          key: ${{ secrets.USER_EC2_SSH_KEY }}
          script: |
            IMAGE=ghcr.io/${{ github.repository_owner }}/user:${{ github.sha }}

            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

            podman pull $IMAGE

            podman stop user || true
            podman rm user || true

            podman run -d \
              --name user \
              --restart=always \
              -p 8080:8080 \
              $IMAGE

            podman image prune -f