name: Assessment Runner Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "assessment_runner/**"
      - ".github/workflows/assessment-runner-service.yml"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/assessment-runner

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: assessment_runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: assessment_runner/go.mod
          cache-dependency-path: assessment_runner/go.sum
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('assessment_runner/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ASSESSMENT_RUNNER_EC2_HOST }}
          username: ${{ secrets.ASSESSMENT_RUNNER_EC2_USER }}
          key: ${{ secrets.ASSESSMENT_RUNNER_EC2_SSH_KEY }}
          script: |
            IMAGE=ghcr.io/${{ github.repository_owner }}/assessment-runner:${{ github.sha }}
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            podman pull $IMAGE
            podman stop assessment-runner || true
            podman rm assessment-runner || true
            podman run -d --name assessment-runner --restart=always --env-file /home/ubuntu/assessment-runner.env -p 8084:8084 $IMAGE
            podman image prune -a -f